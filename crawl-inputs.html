<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crawler input examples</title>
<style>body{font:16px system-ui;background:#f5f6fb;color:#222b40;max-width:850px;margin:40px auto;padding:0 20px}form{background:white;padding:25px;margin:22px 0;border:1px solid #ddd;border-radius:12px}label{display:block;margin:14px 0}input,select,textarea,button{font:inherit;padding:9px;max-width:100%}input:not([type=checkbox]):not([type=radio]),select,textarea{display:block;width:95%;margin-top:7px}button{background:#5146bf;color:white;border:0;border-radius:6px}a{color:#5146bf}</style></head>
<body><a href="/">← Home</a><h1>Discoverable input examples</h1><p>Local crawler fixtures. Forms use explicit actions, methods, labels, and named fields. Submissions are acknowledged without storing data.</p>
<nav><a href="/search?q=design&amp;category=branding&amp;page=1">Example search URL</a> · <a href="/preferences?view=week&amp;sort=priority">Example preferences URL</a></nav>
<form action="/search" method="get"><h2>Search</h2>
<label for="q">Search query<input id="q" name="q" type="search" value="design"></label>
<label for="category">Category<select id="category" name="category"><option value="all">All</option><option value="branding">Branding</option><option value="web">Web</option></select></label>
<label for="page">Page<input id="page" name="page" type="number" min="1" max="10" value="1"></label><button type="submit">Search</button></form>
<form action="/contact" method="post"><h2>Contact demo</h2>
<label for="name">Name<input id="name" name="name" type="text" autocomplete="name" required></label>
<label for="email">Email<input id="email" name="email" type="email" autocomplete="email" required></label>
<label for="website">Website<input id="website" name="website" type="url"></label>
<label for="message">Message<textarea id="message" name="message" rows="4"></textarea></label>
<input name="source" type="hidden" value="crawler-demo"><button type="submit">Send demo request</button></form>
<form action="/preferences" method="get"><h2>Planner preferences</h2>
<label for="view">View<select id="view" name="view"><option value="day">Day</option><option value="week">Week</option></select></label>
<label for="sort">Sort<select id="sort" name="sort"><option value="priority">Priority</option><option value="date">Date</option></select></label>
<label for="due">Due date<input id="due" name="due" type="date"></label>
<label><input name="completed" type="checkbox" value="true"> Include completed tasks</label>
<fieldset><legend>Priority</legend><label><input type="radio" name="priority" value="normal" checked> Normal</label><label><input type="radio" name="priority" value="high"> High</label></fieldset>
<button type="submit">Apply preferences</button></form></body></html>
