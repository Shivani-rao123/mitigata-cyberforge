# config/tools.yaml
#
# Declares every external tool the engine can run. Adding a new tool means
# adding an entry here (plus one parser in core/parsers/) — ScopedExecutor
# and ToolEngine never need to change.
#
# `command` is a list of argv tokens. Placeholders in {curly_braces} are
# filled in from the call's kwargs — never string-concatenated into a shell
# string, so there is no shell-injection surface.

tools:
  web:
    runner: core.katana:run
    parser: core.parsers.katana:parse
    options:
      max_endpoints: 500
  katana:
    binary: katana
    prefer_local: true
    required_version: v1.8.0
    kill_process_tree: true
    failure_pattern: '\[(?:ERR|FTL)\]'
    command:
      - katana
      - -list
      - "{seeds}"
      - -proxy
      - "{proxy}"
      - -crawl-scope
      - "{scope}"
      - -crawl-out-scope
      - '(?i)/(logout|log-out|signout|delete|remove)(/|\?|$)'
      - -js-crawl
      - -form-extraction
      - -tech-detect
      # Katana v1.8.0 known-files probing misses linked pages on the local
      # nonstandard-port app through the scoped proxy. Use normal link crawling.
      - -depth
      - "{depth}"
      - -crawl-duration
      - "{crawl_duration}"
      - -timeout
      - "{request_timeout}"
      - -retry
      - "0"
      - -concurrency
      - "{concurrency}"
      - -parallelism
      - "1"
      - -rate-limit
      - "{rate_limit}"
      - -max-response-size
      - "1048576"
      - -max-domain-pages
      - "100"
      - -filter-similar
      - -jsonl
      - -omit-raw
      - -omit-body
      - -silent
      - -no-color
      - -disable-update-check
      - -output
      - "{output}"
    timeout_seconds: 60
    parser: core.parsers.katana:parse
  nmap:
    binary: nmap
    command: ["nmap", "-sV", "-Pn", "-oX", "-", "{target}"]
    # when allowed_ports is given, "-p {ports}" is inserted after the binary
    ports_flag: ["-p", "{ports}"]
    timeout_seconds: 300
    output_format: xml
    parser: core.parsers.nmap:parse

  # Example of how a second network tool slots in later, with zero code
  # changes to ScopedExecutor or ToolEngine — uncomment and point `network_tool`
  # in config/scope.yaml at "naabu" to switch:
  # naabu:
  #   binary: naabu
  #   command: ["naabu", "-host", "{target}", "-json", "-silent"]
  #   ports_flag: ["-p", "{ports}"]
  #   timeout_seconds: 120
  #   output_format: json_lines
  #   parser: core.parsers.naabu:parse
